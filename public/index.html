<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>云端数据管理台</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%232f5f52"/><text x="32" y="43" font-size="30" text-anchor="middle" fill="white" font-family="sans-serif">云</text></svg>' />
<style>
  :root{
    --bg:#f5f4f0; --panel:#ffffff; --panel2:#faf9f6; --line:#e6e3da;
    --ink:#2c2a25; --ink2:#6b675c; --ink3:#9a958a;
    --jade:#2f5f52; --jade-d:#264d42; --jade-bg:#eef4f1;
    --gold:#b0894a; --gold-bg:#f6f0e4;
    --red:#b5432f; --red-bg:#f7ece9;
    --ok:#3a7d44; --ok-bg:#eaf3ec;
    --radius:12px; --shadow:0 1px 3px rgba(40,35,25,.08),0 6px 20px rgba(40,35,25,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--jade);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px 60px}
  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(245,244,240,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hbar{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--jade),#4a8371);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;box-shadow:var(--shadow)}
  .brand h1{font-size:17px;margin:0;letter-spacing:.5px}
  .brand .sub{font-size:12px;color:var(--ink2);margin-top:1px}
  .spacer{flex:1}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
  .dot.off{background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
  .envchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:4px 6px 4px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2)}
  .envchip .envlbl{color:var(--ink3)}
  #envSelect{font:inherit;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;border:none;background:transparent;color:var(--jade);outline:none;padding:3px 6px;cursor:pointer;max-width:280px}
  #envSelect:focus{color:var(--jade-d)}
  /* tabs */
  nav{max-width:1240px;margin:0 auto;padding:12px 20px 0;display:flex;gap:8px}
  .tab{padding:9px 18px;border-radius:10px 10px 0 0;border:1px solid transparent;border-bottom:none;cursor:pointer;font-size:14px;color:var(--ink2);background:transparent;user-select:none}
  .tab.active{background:var(--panel);border-color:var(--line);color:var(--jade);font-weight:600;position:relative;top:1px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);box-shadow:var(--shadow);margin-top:-1px;padding:22px}
  .section{display:none}.section.active{display:block}
  /* cards grid */
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:.15s}
  .card.click{cursor:pointer}.card.click:hover{border-color:var(--jade);transform:translateY(-2px);box-shadow:var(--shadow)}
  .card .k{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;word-break:break-all}
  .card .v{font-size:30px;font-weight:700;margin-top:6px;color:var(--jade);line-height:1.1}
  .card .m{font-size:12px;color:var(--ink3);margin-top:4px}
  .tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--jade-bg);color:var(--jade);font-weight:600}
  h2.sect{font-size:15px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  h2.sect:first-child{margin-top:0}
  h2.sect .ln{flex:1;height:1px;background:var(--line)}
  /* toolbar */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
  select,input,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-bg)}
  input.mono,textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 15px;border-radius:9px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:var(--jade);color:var(--jade);background:var(--jade-bg)}
  .btn.pri{background:var(--jade);border-color:var(--jade);color:#fff}
  .btn.pri:hover{background:var(--jade-d);color:#fff}
  .btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red);background:var(--red-bg);color:var(--red)}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
  .btn.ghost{background:transparent}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--ink2);font-weight:600;background:var(--panel2);position:sticky;top:0}
  tr:hover td{background:var(--panel2)}
  td.id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--jade);max-width:200px;word-break:break-all}
  th{white-space:nowrap}
  td.val{white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink2)}
  img.cellimg{max-width:84px;max-height:84px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block;background:#fff;transition:transform .15s}
  img.cellimg:hover{transform:scale(1.06)}
  .muted{color:var(--ink3)} .empty{padding:40px;text-align:center;color:var(--ink3)}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--gold-bg);color:var(--gold);font-weight:600;white-space:nowrap}
  .pill.inv{background:var(--jade-bg);color:var(--jade)} .pill.pub{background:var(--ok-bg);color:var(--ok)}
  /* pagination */
  .pager{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
  /* storage */
  .crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px}
  .crumbs .c{cursor:pointer;color:var(--jade);padding:3px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
  .crumbs .c:hover{background:var(--jade-bg)} .crumbs .c.cur{background:var(--jade);color:#fff;border-color:var(--jade)}
  .crumbs .sep{color:var(--ink3)}
  .filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .fitem{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;transition:.15s;position:relative}
  .fitem:hover{border-color:var(--jade);box-shadow:var(--shadow)}
  .fitem.sel{border-color:var(--jade);background:var(--jade-bg)}
  .fitem .thumb{height:90px;border-radius:8px;background:#fff url() center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:26px;overflow:hidden;border:1px solid var(--line)}
  .fitem .thumb img{width:100%;height:100%;object-fit:cover}
  .fitem .nm{font-size:12px;margin-top:8px;word-break:break-all;line-height:1.35;color:var(--ink)}
  .fitem .meta{font-size:11px;color:var(--ink3);margin-top:3px}
  .fitem .ck{position:absolute;top:8px;left:8px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .fitem.sel .ck{background:var(--jade);border-color:var(--jade)}
  .fitem.dir .thumb{background:linear-gradient(135deg,var(--gold-bg),#fff)}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(30,28,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .mask.show{display:flex}
  .modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal .mh h3{margin:0;font-size:15px;flex:1}
  .modal .mb{padding:18px 20px;overflow:auto}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--panel2)}
  textarea.code{width:100%;min-height:340px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;border:1px solid var(--line);border-radius:10px;padding:12px;tab-size:2}
  pre.code{margin:0;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:56vh;overflow:auto}
  .previewimg{max-width:100%;max-height:60vh;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto;background:#fff}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13px;margin-bottom:14px}
  .kv .k{color:var(--ink2)} .kv .v{font-family:ui-monospace,monospace;word-break:break-all}
  /* toast */
  #toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#2c2a25;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);animation:in .2s}
  .toast.err{background:var(--red)} .toast.ok{background:var(--ok)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--jade);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hint{font-size:12px;color:var(--ink3);margin:6px 0 0}
  .banner{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:14px 16px;font-size:13px;color:var(--ink2);margin-bottom:16px;display:none}
  .banner.show{display:block} .banner code{background:#fff;padding:2px 6px;border-radius:5px;font-family:monospace;color:var(--jade)}
  .row2{display:flex;gap:10px;align-items:center}.row2 .grow{flex:1}
  .userlist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
  .userrow{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;background:var(--panel2)}
  .userrow:hover{border-color:var(--jade);background:var(--jade-bg)}
  .userrow .p{font-family:monospace;word-break:break-all}
  @media(max-width:640px){.cards{grid-template-columns:repeat(2,1fr)};td.val{max-width:160px}}
  .pgsize{font-size:12px;padding:4px 8px;border-radius:7px;background:#fff}
  #sec-storage .panel.drop{outline:2px dashed var(--jade);outline-offset:-6px;background:var(--jade-bg)}
  #connBadge{cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">
      <div class="logo">云</div>
      <div>
        <h1>云端数据管理台</h1>
        <div class="sub">云开发环境全量数据 · 数据库 + 云存储运维</div>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="envchip" title="切换云环境"><span class="envlbl">env</span><select id="envSelect"></select></span>
    <span class="badge" id="connBadge" title="点击查看服务状态并刷新连接"><span class="dot" id="connDot"></span><span id="connText">连接中…</span></span>
  </div>
  <nav>
    <div class="tab active" data-tab="overview" role="tab" aria-selected="true">概览</div>
    <div class="tab" data-tab="db" role="tab" aria-selected="false">云数据库</div>
    <div class="tab" data-tab="storage" role="tab" aria-selected="false">云存储</div>
  </nav>
</header>

<div class="wrap">
  <!-- ================= 概览 ================= -->
  <section class="section active" id="sec-overview" role="tabpanel">
    <div class="panel">
      <div class="banner" id="ovBanner"></div>
      <div class="row2" style="margin-bottom:12px">
        <span class="hint" id="ovUpdatedAt"></span>
        <div class="spacer"></div>
        <button class="btn sm" id="ovRefresh">↻ 刷新</button>
      </div>
      <div id="ovLoading" class="empty"><span class="spin"></span> 正在统计…</div>
      <div id="ovBody" style="display:none">
        <h2 class="sect">数据库集合文档数<span class="ln"></span><span class="muted" id="ovDbTotal"></span></h2>
        <div class="grid cards" id="ovCards"></div>
        <h2 class="sect">云存储概览<span class="ln"></span></h2>
        <div class="grid cards" id="ovStorageCards"></div>
        <p class="hint">* 云存储概览自根目录采样统计（上限 5000 个文件），若文件过多可能未计全；精确内容请进入「云存储」逐层浏览。</p>
      </div>
    </div>
  </section>

  <!-- ================= 数据库 ================= -->
  <section class="section" id="sec-db" role="tabpanel">
    <div class="panel">
      <div class="toolbar">
        <label style="color:var(--ink2);font-size:13px">集合</label>
        <select id="dbCollection" style="min-width:210px"></select>
        <button class="btn sm" id="dbRefresh">刷新</button>
        <div class="spacer"></div>
        <label style="color:var(--ink2);font-size:13px">字段</label>
        <select id="dbField"><option value="">（全字段）</option></select>
        <input id="dbQuery" class="mono" placeholder="正则 如 ^wt_|openid$" style="width:150px" />
        <button class="btn sm" id="dbSearch">筛选</button>
        <label style="color:var(--ink2);font-size:13px;margin-left:6px">排序</label>
        <select id="dbSort"><option value="">默认</option></select>
        <select id="dbSortDir"><option value="desc">降序</option><option value="asc">升序</option></select>
      </div>
      <div class="toolbar" style="margin-top:-6px">
        <button class="btn pri sm" id="dbAdd">＋ 新增文档</button>
        <div class="spacer"></div>
        <span id="dbCount" class="muted" style="font-size:13px"></span>
      </div>
      <div style="overflow:auto;max-height:64vh;border:1px solid var(--line);border-radius:10px">
        <table>
          <thead><tr id="dbHead"></tr></thead>
          <tbody id="dbBody"></tbody>
        </table>
      </div>
      <div class="pager">
        <div style="display:flex;gap:10px;align-items:center">
          <select id="dbSize" class="pgsize" title="每页条数">
            <option value="20">20 条/页</option>
            <option value="50">50 条/页</option>
            <option value="100">100 条/页</option>
          </select>
          <button class="btn sm" id="dbPrev">‹ 上一页</button>
          <button class="btn sm" id="dbNext">下一页 ›</button>
        </div>
        <div id="dbPageInfo" class="muted"></div>
      </div>
    </div>
  </section>

  <!-- ================= 云存储 ================= -->
  <section class="section" id="sec-storage" role="tabpanel">
    <div class="panel">
      <div class="crumbs" id="stCrumbs"></div>
      <div class="toolbar">
        <button class="btn sm" id="stUp">↑ 上级</button>
        <button class="btn sm" id="stRefresh">刷新</button>
        <div class="spacer"></div>
        <button class="btn sm" id="stScan">🔎 扫描子目录</button>
        <label class="btn sm" style="margin:0">
          <input type="file" id="stUploadFile" style="display:none" />
          <span id="stUploadLbl">上传文件到当前目录</span>
        </label>
        <button class="btn sm" id="stSelAll">全选本页</button>
        <button class="btn sm" id="stUnselAll">取消全选</button>
        <button class="btn danger sm" id="stDelete" disabled>删除所选（<span class="stselcount">0</span>）</button>
      </div>
      <div id="stLoading" class="empty"><span class="spin"></span> 正在列举…</div>
      <div id="stBody" style="display:none">
        <div class="filegrid" id="stGrid"></div>
      </div>
      <div id="stScanPanel" style="display:none;margin-top:18px">
        <h2 class="sect">子目录（按当前目录下一级路径段聚合）<span class="ln"></span></h2>
        <div class="userlist" id="stUserList"></div>
      </div>
    </div>
  </section>
</div>

<!-- 文档查看/编辑 -->
<div class="mask" id="docMask">
  <div class="modal">
    <div class="mh"><h3 id="docTitle">文档</h3><button class="btn sm ghost" data-close="docMask">✕</button></div>
    <div class="mb"><textarea class="code" id="docText" spellcheck="false"></textarea></div>
    <div class="mf">
      <button class="btn sm" id="docEdit" style="display:none">✎ 进入编辑</button>
      <button class="btn sm ghost" id="docCopy">复制</button>
      <button class="btn sm" id="docClose">关闭</button>
      <button class="btn pri" id="docSave" style="display:none">保存修改</button>
    </div>
  </div>
</div>

<!-- 文件预览 -->
<div class="mask" id="fileMask">
  <div class="modal">
    <div class="mh"><h3 id="fileTitle">文件</h3><button class="btn sm ghost" data-close="fileMask">✕</button></div>
    <div class="mb" id="fileBody"></div>
    <div class="mf"><a class="btn sm" id="fileOpen" target="_blank" rel="noopener" style="display:none">在新标签打开</a><button class="btn sm" id="fileClose">关闭</button></div>
  </div>
</div>

<div id="toasts"></div>
<script src="./app.js"></script>
</body>
</html>
